<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferencje</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        body{
            background-image: linear-gradient(to bottom, #00B9E8, #50C878);
            height: 100vh;
            overflow: auto;
        }

        form{
            position: absolute;
            width: 14vw;
            height: fit-content;
            top: 40vh;
            left: 40vw;

            border: 1px solid black;
            border-radius: 10px;
            padding: 15px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        form > label{
            margin: 4px;
        }
        form>input{
            background-color: transparent;
            margin-top: 5px;
            border: 1px solid yellow;
            border-radius: 5px;
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        form>select{
            background-color: transparent;
            margin-top: 5px;
            border: 1px solid yellow;
            border-radius: 5px;
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        
        form > button{
            position: relative;
            top: 95%;
            background-color: transparent;
            border-radius: 5px;
            border: 1px solid yellow;
            width: 25%;
            height: auto;
            margin-bottom: 5px;
            transition: 0.4s;
        }

        form > button:hover{
            border: 1px solid black;
            background-color: ghostwhite;
        }

        form > a{
            position: relative;
            text-decoration: none;
            font-size: 17px;
            margin-top: 10px;
            color: black;
            transition: 0.4s;
        }
        form > a:hover{
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <form action="/wynikPreferencji" method="post">
        <label>Preferencje użytkownika dotyczące gier:</label>
        <select name="selector" id="selector">Wybierz:
        <option value="co_op">Co-op</option>    
        <option value="campaign">campaign</option>    
        <option value="versus">Versus</option>    
        <option value="history">History of developing</option>    
        </select>
        <br><br>
        <button type="submit">Wyślij</button><br>
        <a href="/">Powrót</a>
    </form>
</body>
</html>
